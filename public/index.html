<!-- CSS for Continuous News Ticker -->
<style>
  .ticker-wrap {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #dc2626;
    color: white;
    padding: 12px 0;
    font-weight: bold;
    font-size: 1.2rem;
    overflow: hidden;
    white-space: nowrap;
    box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
    z-index: 1000;
  }

  .ticker-move {
    display: inline-block;
    padding-left: 100%;
    animation: ticker 25s linear infinite;
  }

  @keyframes ticker {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-100%, 0, 0); }
  }
</style>

<!-- Ticker HTML -->
<div class="ticker-wrap">
  <div class="ticker-move" id="ticker-text">
    📰 LIVE DISTRICT MONITOR: Tournament In Progress... Keep an eye on inflation rates and upcoming weather alerts!
  </div>
</div>

<!-- JavaScript Receiver -->
<script>
  socket.on('host_news_ticker', (msg) => {
    const tickerEl = document.getElementById('ticker-text');
    tickerEl.innerText = `📰 BREAKING NEWS: ${msg}  |  🔮 MARKET FORECAST: Watch out for upcoming district emergencies!`;
  });
</script>
