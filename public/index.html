<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Business Empire Championship — Host Screen</title>
  <style>
    body { background-color: #0d1117; color: #f0f6fc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #58a6ff; margin-bottom: 5px; }
    .leaderboard { width: 100%; border-collapse: collapse; margin-top: 20px; background: #161b22; border-radius: 8px; overflow: hidden; }
    .leaderboard th, .leaderboard td { padding: 15px; text-align: left; border-bottom: 1px solid #30363d; }
    .leaderboard th { background-color: #21262d; color: #8b949e; }
    .stars { color: #f1e05a; font-weight: bold; }
    .ticker-container { position: fixed; bottom: 0; left: 0; width: 100%; background: #da3633; color: white; padding: 12px; font-size: 1.2rem; font-weight: bold; }
  </style>
</head>
<body>

  <h1>🏆 BUSINESS EMPIRE CHAMPIONSHIP</h1>
  <p style="text-align: center; color: #8b949e;">LIVE LEADERBOARD & DISTRICT MONITOR</p>

  <table class="leaderboard">
    <thead>
      <tr>
        <th>Rank</th>
        <th>Company & Venue Name</th>
        <th>Net Worth ($)</th>
        <th>Goodwill Rating</th>
        <th>Estimated Bonus</th>
      </tr>
    </thead>
    <tbody id="leaderboard-body">
      <!-- Dynamic rows inserted here -->
    </tbody>
  </table>

  <div class="ticker-container" id="ticker">
    📰 LIVE TICKER: Tournament Initialization... Waiting for teams to join.
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    socket.on('state_update', (state) => {
      const body = document.getElementById('leaderboard-body');
      body.innerHTML = '';

      const sortedTeams = Object.values(state.teams).sort((a, b) => (b.cash + b.assets - b.debt) - (a.cash + a.assets - a.debt));

      sortedTeams.forEach((team, index) => {
        const netWorth = team.cash + team.assets - team.debt;
        let bonus = "$0";
        if (team.rating >= 4.5) bonus = "+$2,000,000";
        else if (team.rating >= 4.0) bonus = "+$1,400,000";
        else if (team.rating >= 3.5) bonus = "+$800,000";
        else if (team.rating >= 3.0) bonus = "+$400,000";

        body.innerHTML += `
          <tr>
            <td>#${index + 1}</td>
            <td><strong>${team.persistentName}</strong> (${team.venueName || 'Setup'})</td>
            <td>$${netWorth.toLocaleString()}</td>
            <td><span class="stars">⭐ ${team.rating.toFixed(1)}</span> / 5.0</td>
            <td style="color: #3fb950;">${bonus}</td>
          </tr>
        `;
      });
    });

    socket.on('host_news_ticker', (msg) => {
      document.getElementById('ticker').innerText = `📰 LIVE TICKER: ${msg}`;
    });
  </script>
</body>
</html>
