<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Host Projector Screen & Admin</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0e17; color: #e2e8f0; margin: 0; padding: 20px; }
    h1 { color: #38bdf8; text-align: center; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 20px; font-weight: bold; }
    .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    button { background: #0284c7; color: white; border: none; padding: 10px 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: transform 0.1s; }
    button:active { transform: scale(0.95); }
    button:hover { background: #0369a1; }
    .level-btn { background: #059669; }
    .level-btn:hover { background: #047857; }
    .reset-btn { background: #ef4444; }
    .reset-btn:hover { background: #dc2626; }
    .surprise-btn { background: linear-gradient(135deg, #8b5cf6, #ec4899); font-size: 1.05rem; padding: 10px 22px; }
    .surprise-btn:hover { opacity: 0.9; }
    .leaderboard { max-width: 900px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .team-card { background: #0f172a; border-left: 5px solid #38bdf8; padding: 15px; margin-bottom: 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .team-title { font-size: 1.2rem; font-weight: bold; color: #f8fafc; }
    .venue-name { font-size: 0.9rem; color: #38bdf8; font-style: italic; }
    .net-worth { font-size: 1.4rem; font-weight: bold; color: #4ade80; }
    .formula { font-size: 0.8rem; color: #94a3b8; margin-top: 5px; }
    .danger-line { border-top: 2px dashed #f43f5e; text-align: center; color: #f43f5e; font-weight: bold; padding: 10px 0; margin: 15px 0; }
    
    /* Surprise Modal Popup */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
    .modal-card { background: #1e293b; border: 3px solid #ec4899; border-radius: 16px; width: 90%; max-width: 650px; text-align: center; overflow: hidden; box-shadow: 0 0 35px rgba(236, 72, 153, 0.5); animation: popIn 0.4s ease-out; }
    @keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-img { width: 100%; height: 280px; object-fit: cover; }
    .modal-body { padding: 25px; }
    .modal-title { font-size: 1.8rem; color: #f43f5e; margin-bottom: 12px; text-transform: uppercase; }
    .modal-desc { font-size: 1.1rem; color: #f8fafc; line-height: 1.5; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>🏆 BUSINESS EMPIRE CHAMPIONSHIP</h1>
  <div class="subtitle" id="gameHeader">LEVEL 1: CONVENIENCE STORE | DAY 1 / 30</div>

  <div class="controls">
    <button onclick="advanceDay()">⏩ Advance Day</button>
    <button class="level-btn" onclick="setLevel(1)">🏪 Set L1 (Store)</button>
    <button class="level-btn" onclick="setLevel(2)">🍽️ Set L2 (Restaurant)</button>
    <button class="level-btn" onclick="setLevel(3)">🏨 Set L3 (Hotel)</button>
    <button class="surprise-btn" onclick="triggerSurprise()">🎲 SURPRISE CUSTOMER!</button>
    <button class="reset-btn" onclick="resetGame()">🔄 Reset Game</button>
  </div>

  <div class="leaderboard" id="leaderboardList">
    <div style="text-align: center; color: #64748b;">Waiting for teams to join...</div>
  </div>

  <!-- Surprise Overlay -->
  <div class="modal-overlay" id="cameoModal">
    <div class="modal-card">
      <img id="modalImg" class="modal-img" src="" alt="Customer Event">
      <div class="modal-body">
        <div id="modalTitle" class="modal-title">SURPRISE CUSTOMER</div>
        <div id="modalDesc" class="modal-desc">Event details loading...</div>
        <button style="background: #ec4899; font-size: 1.1rem;" onclick="closeModal()">Got It! Resume Game</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();

    function playClickSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch(e){}
    }

    const levelTitles = {
      1: "LEVEL 1: CONVENIENCE STORE",
      2: "LEVEL 2: FINE-DINING RESTAURANT",
      3: "LEVEL 3: LUXURY HOTEL & RESORT"
    };

    socket.on('stateUpdate', (state) => {
      const levelText = levelTitles[state.currentLevel] || `LEVEL ${state.currentLevel}`;
      document.getElementById('gameHeader').innerText = `${levelText} | DAY ${state.simulatedDay} / ${state.maxDays}`;
      
      const teamsArr = Object.values(state.teams).sort((a, b) => b.netWorth - a.netWorth);
      const listEl = document.getElementById('leaderboardList');
      listEl.innerHTML = '';

      if (teamsArr.length === 0) {
        listEl.innerHTML = '<div style="text-align: center; color: #64748b; padding: 20px;">No teams connected yet. Scan QR code to join!</div>';
        return;
      }

      const cutoffIndex = Math.ceil(teamsArr.length * 0.8);

      teamsArr.forEach((team, index) => {
        if (index === cutoffIndex && teamsArr.length > 2) {
          const danger = document.createElement('div');
          danger.className = 'danger-line';
          danger.innerText = '⚠️ ELIMINATION CUTOFF LINE ⚠️';
          listEl.appendChild(danger);
        }

        const card = document.createElement('div');
        card.className = 'team-card';
        card.style.borderColor = index >= cutoffIndex ? '#f43f5e' : '#38bdf8';
        card.innerHTML = `
          <div>
            <div class="team-title">#${index + 1} ${team.groupName}</div>
            <div class="venue-name">"${team.venueName}" (Option ${team.startingOption})</div>
            <div class="formula">Net Worth = Cash ($${team.cash.toLocaleString()}) + Valuation ($${team.inventory.toLocaleString()}) - Debt ($${team.debt.toLocaleString()})</div>
          </div>
          <div class="net-worth">$${team.netWorth.toLocaleString()}</div>
        `;
        listEl.appendChild(card);
      });
    });

    socket.on('cameoEvent', (eventData) => {
      document.getElementById('modalTitle').innerText = eventData.title;
      document.getElementById('modalDesc').innerText = eventData.desc;
      document.getElementById('modalImg').src = eventData.img;
      document.getElementById('cameoModal').style.display = 'flex';
    });

    function advanceDay() { playClickSound(); socket.emit('advanceDay'); }
    function setLevel(lvl) { playClickSound(); socket.emit('setLevel', lvl); }
    function triggerSurprise() { playClickSound(); socket.emit('triggerRandomCameo'); }
    function closeModal() { playClickSound(); document.getElementById('cameoModal').style.display = 'none'; }
    function resetGame() {
      playClickSound();
      if (confirm("Are you sure you want to reset the game back to Day 1 and clear all teams?")) {
        socket.emit('resetGame');
      }
    }
  </script>
</body>
</html>
