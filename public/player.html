<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Terminal</title>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; padding: 15px; margin: 0; }
    .card { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
    .btn { width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .btn-action { background: #2563eb; color: white; }
    .btn-hint { background: #d97706; color: white; }
    .btn-skip { background: #dc2626; color: white; }
    .concept-tag { font-size: 0.85rem; color: #38bdf8; font-weight: bold; display: block; margin-top: 4px; }
  </style>
</head>
<body>

  <!-- 1. Registration Screen -->
  <div id="setup-screen" class="card">
    <h2>🏢 Executive Onboarding</h2>
    <input type="text" id="persistentName" placeholder="Persistent Team Name (e.g. Apex Corp)" style="width: 90%; padding: 10px; margin-bottom: 10px;"><br>
    <input type="text" id="venueName" placeholder="Level Venue Name (e.g. Quick Stop)" style="width: 90%; padding: 10px; margin-bottom: 10px;"><br>
    <select id="role" style="width: 95%; padding: 10px; margin-bottom: 15px;">
      <option value="CEO">CEO (Macro Strategy)</option>
      <option value="MANAGER">Manager (Micro Operations)</option>
    </select><br>
    <button class="btn btn-action" onclick="register()">CONNECT TERMINAL</button>
  </div>

  <!-- 2. Decision Screen -->
  <div id="game-screen" style="display: none;">
    <div class="card">
      <h3 id="question-title">Loading Decision...</h3>
      <span id="concept-tag" class="concept-tag"></span>
      <p id="question-desc" style="color: #94a3b8;"></p>
    </div>

    <!-- Action Buttons (Only Actions Shown — No Consequences Revealed) -->
    <div id="options-container"></div>

    <!-- Lifeline Buttons -->
    <div class="card" style="margin-top: 20px;">
      <button class="btn btn-hint" onclick="useHint()">🔓 UNLOCK HINT (-$50,000 Cash)</button>
      <button class="btn btn-skip" onclick="useSkip()">⏭️ SKIP QUESTION (-$300,000 Penalty)</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let teamData = {};

    function register() {
      teamData.persistentName = document.getElementById('persistentName').value;
      teamData.venueName = document.getElementById('venueName').value;
      teamData.role = document.getElementById('role').value;

      socket.emit('register_team', teamData);
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';

      // Load sample initial decision
      renderSampleQuestion();
    }

    function renderSampleQuestion() {
      document.getElementById('question-title').innerText = "📌 School District Juice Bulk Deal";
      document.getElementById('concept-tag').innerText = "[Concept: Price Elasticity of Demand (|Ed| > 1)]";
      document.getElementById('question-desc').innerText = "The local school board offers to buy 500 juice boxes daily if you grant a 30% bulk discount.";

      const container = document.getElementById('options-container');
      container.innerHTML = `
        <button class="btn btn-action" onclick="submitChoice(0)">Accept the 30% bulk discount deal</button>
        <button class="btn btn-action" onclick="submitChoice(1)">Reject deal to protect single-unit margin</button>
        <button class="btn btn-action" onclick="submitChoice(2)">Counter-offer with a 10% discount</button>
        <button class="btn btn-action" onclick="submitChoice(3)">Propose a mandatory combo bundle deal</button>
      `;
    }

    function submitChoice(choiceIndex) {
      socket.emit('submit_solo_choice', {
        persistentName: teamData.persistentName,
        questionId: "sample_q1",
        choiceIndex: choiceIndex,
        isHintUsed: false,
        isSkipUsed: false
      });
      alert("Decision Submitted! Waiting for next scenario...");
    }

    function useHint() {
      alert("CONCEPT HINT: When demand is price elastic (|Ed| > 1), dropping the unit price increases total revenue (R = P x Q) because sales volume rises at a higher percentage rate!");
    }

    function useSkip() {
      socket.emit('submit_solo_choice', {
        persistentName: teamData.persistentName,
        questionId: "sample_q1",
        choiceIndex: -1,
        isHintUsed: false,
        isSkipUsed: true
      });
      alert("Question Skipped. -$300,000 Penalty Applied.");
    }
  </script>
</body>
</html>
